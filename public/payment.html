<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Payment — Doctor On Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:'#07191D', canvas:'#F4F7F6', teal:'#0D9488', 'teal-dark':'#0F766E', brass:'#D97706', available:'#10B981', busy:'#F59E0B', offduty:'#6B7280' },
    fontFamily: { display:['Fraunces','ui-serif','serif'], sans:['Inter','ui-sans-serif','sans-serif'], mono:['"IBM Plex Mono"','ui-monospace','monospace'] },
  } } };
</script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="doctors" class="bg-canvas text-ink">

<div id="site-header"></div>

<main class="mx-auto max-w-sm px-4 sm:px-5 py-10 sm:py-14">
  <div id="loading" class="text-center py-24 text-slate-400 text-sm">Loading your appointment…</div>

  <div id="pay-view" class="hidden">
    <!-- Header -->
    <div class="text-center mb-7">
      <div class="w-14 h-14 rounded-2xl bg-teal/10 flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-teal" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
      </div>
      <p class="font-mono text-xs uppercase tracking-widest text-teal mb-1">Secure checkout</p>
      <h1 class="font-display text-2xl">Confirm &amp; pay</h1>
    </div>

    <!-- Appointment summary -->
    <div class="bg-white border border-slate-100 rounded-2xl p-4 mb-5 shadow-sm space-y-2.5 text-sm">
      <div class="flex justify-between items-center"><span class="text-slate-400">Doctor</span><span id="p-doctor" class="font-semibold">—</span></div>
      <div class="flex justify-between items-center"><span class="text-slate-400">Date &amp; time</span><span id="p-time" class="font-mono text-sm">—</span></div>
      <div class="flex justify-between items-center pt-2.5 border-t border-slate-100">
        <span class="text-slate-400">Amount due</span>
        <span id="p-amount" class="font-bold font-mono text-2xl text-ink">—</span>
      </div>
    </div>

    <!-- Card form -->
    <form id="pay-form" class="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm space-y-4">
      <div>
        <label class="text-sm font-semibold block mb-2">Name on card</label>
        <input id="cardName" required class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal transition bg-white" placeholder="Jordan Rivera">
      </div>
      <div>
        <label class="text-sm font-semibold block mb-2">Card number</label>
        <input id="cardNumber" required inputmode="numeric" maxlength="19"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-teal transition bg-white" placeholder="4242 4242 4242 4242">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm font-semibold block mb-2">Expiry</label>
          <input id="expiry" required class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-teal transition bg-white" placeholder="MM/YY">
        </div>
        <div>
          <label class="text-sm font-semibold block mb-2">CVV</label>
          <input id="cvv" required maxlength="4" inputmode="numeric" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-teal transition bg-white" placeholder="123">
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs text-slate-400 bg-slate-50 rounded-xl px-3 py-2.5 border border-slate-100">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        Demo checkout — no real card is charged.
      </div>
      <p id="pay-error" class="text-sm text-red-500 hidden text-center"></p>
      <button id="pay-btn" type="submit" class="w-full py-4 rounded-2xl bg-teal text-white font-semibold hover:bg-teal-dark transition active:scale-95 shadow-lg shadow-teal/25 text-base">
        Pay &amp; confirm appointment
      </button>
    </form>
  </div>

  <!-- Success state -->
  <div id="success-view" class="hidden text-center py-10">
    <div class="relative mx-auto w-20 h-20 mb-6">
      <div class="absolute inset-0 rounded-full bg-emerald-100 animate-ping opacity-30"></div>
      <div class="relative w-20 h-20 rounded-full bg-emerald-100 flex items-center justify-center">
        <svg class="w-9 h-9 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      </div>
    </div>
    <h1 class="font-display text-2xl mb-2">Payment successful!</h1>
    <p class="text-slate-500 mb-1 text-sm">Your appointment is confirmed.</p>
    <p id="txn-ref" class="text-xs text-slate-400 font-mono mb-8"></p>
    <a href="/dashboard.html" class="inline-flex items-center gap-2 px-6 py-3.5 rounded-2xl bg-teal text-white font-semibold hover:bg-teal-dark transition active:scale-95 shadow-lg shadow-teal/25">
      View my appointments
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
    </a>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
const appointmentId = new URLSearchParams(location.search).get('appointmentId');
let appt = null;

async function init() {
  if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
  if (!appointmentId) { document.getElementById('loading').textContent = 'No appointment specified.'; return; }
  try {
    const { appointments } = await Api.get('/appointments/mine');
    appt = appointments.find(a => String(a.id) === String(appointmentId));
    if (!appt) throw new Error('not found');
    document.getElementById('p-doctor').textContent = appt.doctorName;
    document.getElementById('p-time').textContent = `${fmtDate(appt.date)} · ${fmtTime(appt.startTime)}`;
    document.getElementById('p-amount').textContent = money(appt.amount);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('pay-view').classList.remove('hidden');
  } catch {
    document.getElementById('loading').textContent = 'Could not load this appointment.';
  }
}

// Card number formatting
document.getElementById('cardNumber').addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g, '').slice(0, 16);
  e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
});
document.getElementById('expiry').addEventListener('input', e => {
  let v = e.target.value.replace(/\D/g, '').slice(0, 4);
  if (v.length >= 2) v = v.slice(0, 2) + '/' + v.slice(2);
  e.target.value = v;
});

document.getElementById('pay-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('pay-error');
  errEl.classList.add('hidden');
  const btn = document.getElementById('pay-btn');
  btn.disabled = true; btn.textContent = 'Processing…';
  try {
    const { transactionRef } = await Api.post('/payments/mock', {
      appointmentId,
      cardName: document.getElementById('cardName').value,
      cardNumber: document.getElementById('cardNumber').value,
      expiry: document.getElementById('expiry').value,
      cvv: document.getElementById('cvv').value,
    });
    document.getElementById('pay-view').classList.add('hidden');
    document.getElementById('txn-ref').textContent = 'Reference: ' + transactionRef;
    document.getElementById('success-view').classList.remove('hidden');
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Pay & confirm appointment';
  }
});

init();
</script>
</body>
</html>
