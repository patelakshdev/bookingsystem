<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in — Doctor On Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:'#07191D', canvas:'#F4F7F6', teal:'#0D9488', 'teal-dark':'#0F766E', brass:'#D97706', available:'#10B981', busy:'#F59E0B', offduty:'#6B7280' },
    fontFamily: { display:['Fraunces','ui-serif','serif'], sans:['Inter','ui-sans-serif','sans-serif'], mono:['"IBM Plex Mono"','ui-monospace','monospace'] },
  } } };
</script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="login" class="bg-canvas text-ink min-h-screen flex flex-col">

<div id="site-header"></div>

<main class="flex-1 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <!-- Logo icon at top -->
    <div class="flex justify-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-ink flex items-center justify-center shadow-xl">
        <svg width="30" height="30" viewBox="0 0 26 26" fill="none">
          <path d="M13 2 L13 24 M2 13 L24 13" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="13" cy="13" r="10" stroke="#F4F7F6" stroke-width="1.5" opacity="0.4"/>
        </svg>
      </div>
    </div>

    <div class="text-center mb-7">
      <h1 class="font-display text-2xl sm:text-3xl mb-1">Welcome back</h1>
      <p class="text-slate-400 text-sm">Sign in to manage your appointments</p>
    </div>

    <form id="login-form" class="space-y-4 bg-white border border-slate-100 rounded-2xl p-5 sm:p-6 shadow-sm">
      <div>
        <label class="text-sm font-semibold block mb-2" for="email">Email address</label>
        <input id="email" type="email" required autocomplete="email"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal transition bg-white"
          placeholder="you@example.com">
      </div>
      <div>
        <label class="text-sm font-semibold block mb-2" for="password">Password</label>
        <div class="relative">
          <input id="password" type="password" required autocomplete="current-password"
            class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal transition bg-white pr-12"
            placeholder="••••••••">
          <button type="button" id="toggle-pw" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition" tabindex="-1">
            <svg id="eye-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>
      <p id="login-error" class="text-sm text-red-500 hidden bg-red-50 border border-red-200 rounded-xl px-3 py-2.5"></p>
      <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-2xl bg-teal text-white font-semibold hover:bg-teal-dark transition active:scale-95 shadow-lg shadow-teal/25 text-sm">
        Sign in
      </button>
    </form>

    <p class="text-sm text-slate-400 mt-5 text-center">
      New here? <a href="/register.html" class="text-teal font-semibold hover:underline">Create a free account</a>
    </p>

    <!-- Demo credentials -->
    <div class="mt-6 p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-700 space-y-1.5">
      <p class="font-semibold text-amber-800">Demo credentials</p>
      <p class="font-mono">Patient: patient@meridianhealth.example<br>Password: patient123</p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
if (Auth.isLoggedIn()) window.location.href = '/dashboard.html';

document.getElementById('toggle-pw').addEventListener('click', () => {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('submit-btn');
  errEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { token, user } = await Api.post('/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });
    Auth.setSession(token, user);
    const redirect = new URLSearchParams(location.search).get('redirect');
    window.location.href = redirect ? decodeURIComponent(redirect) : '/dashboard.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
