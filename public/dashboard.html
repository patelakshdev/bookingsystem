<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Appointments — Doctor On Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:'#07191D', canvas:'#F4F7F6', teal:'#0D9488', 'teal-dark':'#0F766E', 'teal-light':'#CCFBF1', brass:'#D97706', available:'#10B981', busy:'#F59E0B', offduty:'#6B7280' },
    fontFamily: { display:['Fraunces','ui-serif','serif'], sans:['Inter','ui-sans-serif','sans-serif'], mono:['"IBM Plex Mono"','ui-monospace','monospace'] },
  } } };
</script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="dashboard" class="bg-canvas text-ink">

<div id="site-header"></div>

<main class="mx-auto max-w-3xl px-4 sm:px-8 py-8 sm:py-12">
  <!-- Booked banner -->
  <div id="banner" class="hidden mb-5 px-4 py-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-medium flex items-center gap-3">
    <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    Appointment booked — you're all set! Pay at the front desk on arrival.
  </div>

  <!-- Header -->
  <div class="flex items-start justify-between mb-7 gap-4">
    <div>
      <p class="font-mono text-xs uppercase tracking-widest text-teal mb-1">Your care</p>
      <h1 class="font-display text-2xl sm:text-3xl">My appointments</h1>
    </div>
    <a href="/doctors.html" class="shrink-0 flex items-center gap-1.5 px-4 py-2.5 rounded-2xl bg-teal text-white text-sm font-medium hover:bg-teal-dark transition active:scale-95 shadow-sm shadow-teal/30">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      Book new
    </a>
  </div>

  <div id="appt-list" class="space-y-3">
    <div class="h-28 rounded-2xl skel"></div>
    <div class="h-28 rounded-2xl skel"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
if (!Auth.isLoggedIn()) window.location.href = '/login.html?redirect=' + encodeURIComponent('/dashboard.html');
if (Auth.isStaff()) window.location.href = '/reception/index.html';

if (new URLSearchParams(location.search).get('booked') === '1') {
  document.getElementById('banner').classList.remove('hidden');
}

const statusColors = {
  pending: 'bg-amber-50 text-amber-700 ring-amber-200',
  confirmed: 'bg-emerald-50 text-emerald-700 ring-emerald-200',
  completed: 'bg-teal-50 text-teal-700 ring-teal-200',
  cancelled: 'bg-slate-100 text-slate-500 ring-slate-200',
};

function apptCard(a) {
  const upcoming = ['pending', 'confirmed'].includes(a.status);
  const statusClass = statusColors[a.status] || statusColors.pending;
  const isPaid = a.paymentStatus === 'paid';
  return `
    <div class="bg-white border border-slate-100 rounded-2xl p-4 sm:p-5 shadow-sm touch-card">
      <!-- Top row: Doctor + status badge -->
      <div class="flex items-start justify-between gap-3 mb-3">
        <div>
          <div class="font-semibold text-base">${a.doctorName}</div>
          <div class="text-xs text-slate-400 font-mono mt-0.5">${a.specialty}</div>
        </div>
        <span class="shrink-0 text-xs px-2.5 py-1 rounded-full ring-1 ${statusClass} capitalize font-medium">${a.status}</span>
      </div>
      <!-- Date + time chip row -->
      <div class="flex items-center gap-2 flex-wrap mb-3">
        <div class="flex items-center gap-1.5 text-sm text-slate-600 bg-slate-50 border border-slate-100 px-3 py-1.5 rounded-xl">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          ${fmtDate(a.date)}
        </div>
        <div class="flex items-center gap-1.5 text-sm text-slate-600 bg-slate-50 border border-slate-100 px-3 py-1.5 rounded-xl font-mono">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          ${fmtTime(a.startTime)} – ${fmtTime(a.endTime)}
        </div>
      </div>
      ${a.reason ? `<p class="text-xs text-slate-400 italic mb-3">"${a.reason}"</p>` : ''}
      <!-- Bottom row: payment + cancel -->
      <div class="flex items-center justify-between border-t border-slate-100 pt-3">
        <div class="flex items-center gap-1.5 text-xs">
          ${isPaid
            ? `<span class="flex items-center gap-1 text-emerald-600 font-medium"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Paid · ${money(a.amount)}</span>`
            : a.paymentMethod === 'online'
              ? `<span class="text-amber-600 font-medium flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>Payment pending · ${money(a.amount)}</span>`
              : `<span class="text-slate-400 flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21H5a2 2 0 01-2-2V7a2 2 0 012-2h14a2 2 0 012 2v12a2 2 0 01-2 2z"/></svg>Pay at hospital · ${money(a.amount)}</span>`
          }
        </div>
        ${upcoming ? `<button data-id="${a.id}" class="cancel-btn text-xs text-red-500 hover:text-red-700 font-medium px-3 py-1.5 rounded-xl hover:bg-red-50 transition active:scale-95">Cancel</button>` : ''}
      </div>
    </div>`;
}

async function load() {
  const list = document.getElementById('appt-list');
  try {
    const { appointments } = await Api.get('/appointments/mine');
    list.innerHTML = appointments.length
      ? appointments.map(apptCard).join('')
      : `<div class="text-center py-16 border-2 border-dashed border-slate-200 rounded-2xl">
           <svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
           <p class="text-slate-400 font-medium mb-1">No appointments yet</p>
           <p class="text-sm text-slate-400 mb-5">Find a doctor and book your first slot.</p>
           <a href="/doctors.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl bg-teal text-white font-medium hover:bg-teal-dark transition active:scale-95 text-sm">Browse doctors</a>
         </div>`;
    list.querySelectorAll('.cancel-btn').forEach(btn => btn.addEventListener('click', () => cancelAppt(btn.dataset.id)));
  } catch (e) {
    list.innerHTML = `<p class="text-red-500 text-sm text-center py-8">${e.message}</p>`;
  }
}

async function cancelAppt(id) {
  if (!confirm('Cancel this appointment? This cannot be undone.')) return;
  try {
    await Api.patch('/appointments/' + id, { status: 'cancelled' });
    load();
  } catch (e) {
    alert(e.message);
  }
}

load();
</script>
</body>
</html>
