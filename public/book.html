<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Book an Appointment — Doctor On Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink:'#07191D', canvas:'#F4F7F6', teal:'#0D9488', 'teal-dark':'#0F766E', 'teal-light':'#CCFBF1', brass:'#D97706', available:'#10B981', busy:'#F59E0B', offduty:'#6B7280' },
    fontFamily: { display:['Fraunces','ui-serif','serif'], sans:['Inter','ui-sans-serif','sans-serif'], mono:['"IBM Plex Mono"','ui-monospace','monospace'] },
  } } };
</script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="doctors" class="bg-canvas text-ink">

<div id="site-header"></div>

<!-- Sign in gate -->
<div id="signin-gate" class="hidden min-h-[70vh] flex items-center justify-center px-5 py-20">
  <div class="text-center max-w-sm w-full">
    <div class="w-16 h-16 rounded-2xl bg-teal/10 flex items-center justify-center mx-auto mb-5">
      <svg class="w-8 h-8 text-teal" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
    </div>
    <h1 class="font-display text-2xl mb-2">Sign in to book</h1>
    <p class="text-slate-500 text-sm mb-7 leading-relaxed">Create a free account or sign in to reserve your appointment — takes less than a minute.</p>
    <div class="flex flex-col gap-3">
      <a id="register-link" href="/register.html" class="w-full py-3.5 rounded-2xl bg-teal text-white font-semibold text-center hover:bg-teal-dark transition active:scale-95 shadow-lg shadow-teal/25">Create free account</a>
      <a id="signin-link" href="/login.html" class="w-full py-3.5 rounded-2xl border border-slate-200 font-medium text-center hover:bg-white transition active:scale-95">Sign in</a>
    </div>
  </div>
</div>

<main id="booking-main" class="hidden max-w-5xl mx-auto px-4 sm:px-8 py-6 sm:py-10">
  <!-- Doctor summary card -->
  <div id="doctor-summary" class="bg-white border border-slate-100 rounded-2xl p-4 sm:p-6 mb-6 shadow-sm"></div>

  <!-- Mobile: stacked, Desktop: side-by-side -->
  <div class="grid lg:grid-cols-[1.3fr_1fr] gap-6 lg:gap-8">
    <!-- Left: Steps -->
    <div class="space-y-7">
      <!-- Step 1: Date & Time -->
      <div>
        <div class="flex items-center gap-2 mb-4">
          <div class="w-7 h-7 rounded-full bg-teal flex items-center justify-center shrink-0">
            <span class="text-white text-xs font-bold">1</span>
          </div>
          <h2 class="font-display text-lg sm:text-xl">Choose date &amp; time</h2>
        </div>
        <!-- Date tabs: horizontal scroll on mobile -->
        <div id="date-tabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-5"></div>
        <div id="slot-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2 min-h-[60px]">
          <div class="h-11 rounded-xl skel"></div>
          <div class="h-11 rounded-xl skel"></div>
          <div class="h-11 rounded-xl skel"></div>
        </div>
      </div>

      <!-- Step 2: Reason -->
      <div>
        <div class="flex items-center gap-2 mb-3">
          <div class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center shrink-0">
            <span class="text-slate-600 text-xs font-bold">2</span>
          </div>
          <h2 class="font-display text-lg sm:text-xl">Reason <span class="text-slate-400 text-sm font-sans font-normal">(optional)</span></h2>
        </div>
        <textarea id="reason" rows="3" placeholder="e.g. Annual check-up, follow-up on test results…"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal bg-white resize-none"></textarea>
      </div>

      <!-- Step 3: Payment — visible on mobile above summary -->
      <div>
        <div class="flex items-center gap-2 mb-3">
          <div class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center shrink-0">
            <span class="text-slate-600 text-xs font-bold">3</span>
          </div>
          <h2 class="font-display text-lg sm:text-xl">Payment method</h2>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="pay-option flex items-start gap-3 border border-slate-200 rounded-2xl p-4 cursor-pointer hover:border-teal transition has-[:checked]:border-teal has-[:checked]:bg-teal/5">
            <input type="radio" name="payment" value="online" class="mt-1 accent-teal w-4 h-4" checked>
            <span>
              <span class="block font-semibold text-sm">Pay online now</span>
              <span class="block text-xs text-slate-400 mt-0.5">Secure card payment. Confirmed instantly.</span>
            </span>
          </label>
          <label class="pay-option flex items-start gap-3 border border-slate-200 rounded-2xl p-4 cursor-pointer hover:border-teal transition has-[:checked]:border-teal has-[:checked]:bg-teal/5">
            <input type="radio" name="payment" value="pay_at_hospital" class="mt-1 accent-teal w-4 h-4">
            <span>
              <span class="block font-semibold text-sm">Pay at hospital</span>
              <span class="block text-xs text-slate-400 mt-0.5">Reserve now, settle at the front desk.</span>
            </span>
          </label>
        </div>
      </div>
    </div>

    <!-- Right: Booking Summary (sticky on desktop, below steps on mobile) -->
    <aside class="bg-white border border-slate-100 rounded-2xl p-5 h-fit lg:sticky lg:top-24 shadow-sm">
      <h3 class="font-display text-lg mb-4">Booking summary</h3>
      <dl class="space-y-3 text-sm">
        <div class="flex justify-between items-center"><dt class="text-slate-400">Doctor</dt><dd id="sum-doctor" class="font-medium text-right max-w-[60%] text-ellipsis overflow-hidden">—</dd></div>
        <div class="flex justify-between items-center"><dt class="text-slate-400">Date</dt><dd id="sum-date" class="font-medium">—</dd></div>
        <div class="flex justify-between items-center"><dt class="text-slate-400">Time</dt><dd id="sum-time" class="font-mono font-medium">—</dd></div>
        <div class="flex justify-between items-center pt-3 border-t border-slate-100">
          <dt class="text-slate-400">Consultation fee</dt>
          <dd id="sum-fee" class="font-bold font-mono text-lg text-ink">—</dd>
        </div>
      </dl>
      <button id="confirm-btn" disabled class="w-full mt-5 py-4 rounded-2xl bg-teal text-white font-semibold disabled:opacity-30 disabled:cursor-not-allowed hover:bg-teal-dark transition active:scale-95 shadow-lg shadow-teal/25 text-base">
        Select a time slot
      </button>
      <p id="booking-error" class="text-sm text-red-500 mt-3 hidden text-center"></p>
    </aside>
  </div>
</main>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
const doctorId = new URLSearchParams(location.search).get('doctorId');
let selectedDate = null, selectedSlot = null, doctor = null;

function todayPlus(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function dayLabel(dateStr, i) {
  if (i === 0) return 'Today';
  if (i === 1) return 'Tomorrow';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
}

async function init() {
  if (!doctorId) {
    document.getElementById('booking-main').innerHTML = '<p class="py-24 text-center text-slate-400">No doctor selected. <a href="/doctors.html" class="text-teal underline">Browse doctors →</a></p>';
    document.getElementById('booking-main').classList.remove('hidden');
    return;
  }
  if (!Auth.isLoggedIn()) {
    const gate = document.getElementById('signin-gate');
    const ret = encodeURIComponent('/book.html?doctorId=' + doctorId);
    document.getElementById('signin-link').href = '/login.html?redirect=' + ret;
    document.getElementById('register-link').href = '/register.html?redirect=' + ret;
    gate.classList.remove('hidden');
    return;
  }
  document.getElementById('booking-main').classList.remove('hidden');

  try {
    const { doctor: d } = await Api.get('/doctors/' + doctorId);
    doctor = d;
    renderDoctorSummary(d);
    document.getElementById('sum-doctor').textContent = d.name;
    document.getElementById('sum-fee').textContent = money(d.consultationFee);
  } catch {
    document.getElementById('doctor-summary').innerHTML = '<p class="text-red-500 text-sm">Could not load this doctor.</p>';
    return;
  }

  renderDateTabs();
  selectDate(todayPlus(0), 0);
}

function renderDoctorSummary(d) {
  const b = statusBadge(d.availabilityStatus);
  const initials = d.name.replace('Dr. ', '').split(' ').map(p => p[0]).slice(0, 2).join('');
  document.getElementById('doctor-summary').innerHTML = `
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-teal flex items-center justify-center text-white font-display text-xl shrink-0 shadow-inner">${initials}</div>
      <div class="flex-1 min-w-0">
        <div class="font-display text-xl">${d.name}</div>
        <div class="text-sm text-slate-400 font-mono mt-0.5">${d.specialty} · ${d.location}</div>
      </div>
      <span class="hidden sm:inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full ring-1 ${b.cls}"><span class="${b.dot}"></span>${b.label}${d.statusNote ? ' — ' + d.statusNote : ''}</span>
    </div>
    <div class="sm:hidden mt-3">
      <span class="inline-flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full ring-1 ${b.cls}"><span class="${b.dot}"></span>${b.label}</span>
    </div>`;
}

function renderDateTabs() {
  const tabs = document.getElementById('date-tabs');
  tabs.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const date = todayPlus(i);
    const btn = document.createElement('button');
    btn.className = 'date-tab shrink-0 px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-medium hover:border-teal transition bg-white active:scale-95';
    btn.textContent = dayLabel(date, i);
    btn.dataset.date = date;
    btn.addEventListener('click', () => selectDate(date, i));
    tabs.appendChild(btn);
  }
}

async function selectDate(date, i) {
  selectedDate = date; selectedSlot = null;
  document.querySelectorAll('.date-tab').forEach(t => {
    const active = t.dataset.date === date;
    t.classList.toggle('bg-teal', active);
    t.classList.toggle('text-white', active);
    t.classList.toggle('border-teal', active);
    t.classList.toggle('border-slate-200', !active);
  });
  updateSummary();
  const grid = document.getElementById('slot-grid');
  grid.innerHTML = '<div class="h-11 rounded-xl skel"></div><div class="h-11 rounded-xl skel"></div><div class="h-11 rounded-xl skel"></div>';
  try {
    const { slots } = await Api.get(`/doctors/${doctorId}/slots?date=${date}`);
    grid.innerHTML = slots.length ? slots.map(s => `
      <button class="slot-btn px-3 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-mono hover:border-teal transition active:scale-95" data-slot-id="${s.id}" data-start="${s.startTime}" data-end="${s.endTime}">
        ${fmtTime(s.startTime)}
      </button>`).join('') : '<p class="col-span-full text-sm text-slate-400 py-4">No openings this day — try another date.</p>';
    grid.querySelectorAll('.slot-btn').forEach(btn => btn.addEventListener('click', () => selectSlot(btn)));
  } catch {
    grid.innerHTML = '<p class="col-span-full text-sm text-red-500 py-4">Could not load time slots.</p>';
  }
}

function selectSlot(btn) {
  document.querySelectorAll('.slot-btn').forEach(b => { b.classList.remove('bg-teal', 'text-white', 'border-teal'); b.classList.add('border-slate-200'); });
  btn.classList.add('bg-teal', 'text-white', 'border-teal');
  btn.classList.remove('border-slate-200');
  selectedSlot = { id: btn.dataset.slotId, start: btn.dataset.start, end: btn.dataset.end };
  updateSummary();
}

function updateSummary() {
  document.getElementById('sum-date').textContent = selectedDate ? fmtDate(selectedDate) : '—';
  document.getElementById('sum-time').textContent = selectedSlot ? `${fmtTime(selectedSlot.start)} – ${fmtTime(selectedSlot.end)}` : '—';
  const btn = document.getElementById('confirm-btn');
  if (selectedSlot) { btn.disabled = false; btn.textContent = 'Confirm appointment'; }
  else { btn.disabled = true; btn.textContent = 'Select a time slot'; }
}

document.getElementById('confirm-btn').addEventListener('click', async () => {
  const errEl = document.getElementById('booking-error');
  errEl.classList.add('hidden');
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
  const reason = document.getElementById('reason').value.trim();
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true; btn.textContent = 'Booking…';
  try {
    const { appointment } = await Api.post('/appointments', { doctorId, slotId: selectedSlot.id, reason, paymentMethod });
    if (paymentMethod === 'online') {
      window.location.href = '/payment.html?appointmentId=' + appointment.id;
    } else {
      window.location.href = '/dashboard.html?booked=1';
    }
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Confirm appointment';
  }
});

init();
</script>
</body>
</html>
